<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕯️ Emily — Velitas Artesanales</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        
        body {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: #ffd8b8;
            min-height: 100vh;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            padding: 35px;
            background: radial-gradient(circle at center, #2b1f16, #000000);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid #d4956a;
            box-shadow: 0 0 25px rgba(255, 183, 107, 0.25);
        }

        header h1 {
            font-size: 2.8em;
            background: linear-gradient(90deg, #ffb380, #ffd2b3, #ffb380);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        header p {
            color: #f8b996;
            font-size: 1.2em;
            letter-spacing: 3px;
        }

        .clima {
            background: linear-gradient(145deg, #241c16, #1a1510);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 350px;
            margin: 0 auto;
            border: 1px solid #b8734d;
            box-shadow: 0 0 18px rgba(255, 160, 90, 0.15);
        }

        .clima h3 {
            color: #ffc999;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .clima h4 {
            color: #ffd4a3;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .temp {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffd4a3;
            margin: 15px 0;
        }

        .clima p {
            color: #e5b896;
            margin: 5px 0;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <!-- 1️⃣ NOMBRE DE LA TIENDA -->
    <header>
        <h1>🕯️ Emily 🕯️</h1>
        <p>VELITAS ARTESANALES ✨</p>
    </header>

    <!-- 2️⃣ CLIMA EN BOGOTÁ -->
    <div class="clima">
        <h3>🌤️ Clima en Bogotá</h3>
        <h4 id="ciudad">Cargando...</h4>
        <div class="temp" id="temperatura">-- °C</div>
        <p id="descripcion"></p>
        <p>💧 Humedad: <span id="humedad">--</span>%</p>
    </div>

    <!-- ❌ NO HAY PRODUCTOS NI NUESTRAS CREACIONES -->

    <script>
        const URL = "https://api.openweathermap.org/data/2.5/weather?q=Bogota&appid=b59b13100506efe28c35b8d814c99694&units=metric&lang=es";

        fetch(URL)
            .then(res => res.json())
            .then(datos => {
                document.getElementById("ciudad").textContent = datos.name;
                document.getElementById("temperatura").textContent = datos.main.temp + " °C";
                document.getElementById("descripcion").textContent = datos.weather[0].description;
                document.getElementById("humedad").textContent = datos.main.humidity + "%";
            })
            .catch(err => console.error("Error:", err));
    </script>

</body>
</html>
