<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💱 Conversor de Monedas — Emily</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', serif; }
        
        body {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: #ffd8b8;
            min-height: 100vh;
            padding: 50px 20px;
        }

        header {
            text-align: center;
            padding: 30px;
            background: radial-gradient(circle at center, #2b1f16, #000000);
            border-radius: 20px;
            margin-bottom: 40px;
            border: 2px solid #d4956a;
            box-shadow: 0 0 25px rgba(255, 183, 107, 0.25);
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #ffb380, #ffd2b3, #ffb380);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .contenedor {
            max-width: 450px;
            margin: 0 auto;
        }

        .tarjeta {
            background: linear-gradient(145deg, #241c16, #1a1510);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #b8734d;
            box-shadow: 0 0 18px rgba(255, 160, 90, 0.15);
        }

        .tarjeta h2 {
            text-align: center;
            color: #ffc999;
            margin-bottom: 25px;
            font-size: 1.5em;
        }

        .fila {
            margin: 15px 0;
            padding: 12px;
            border-bottom: 1px solid #443322;
        }

        .etiqueta {
            color: #e5b896;
            font-size: 1em;
        }

        .valor {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffd700;
            margin-top: 5px;
        }

        .info {
            margin-top: 25px;
            font-size: 0.85em;
            color: #997755;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🕯️ Emily — Velitas Artesanales</h1>
        <p style="color: #f8b996; margin-top: 8px;">Conversor de Monedas 💱</p>
    </header>

    <div class="contenedor">
        <div class="tarjeta">
            <h2>💱 Tasas de Cambio</h2>

            <!-- ✅ 1 DÓLAR en Pesos Colombianos -->
            <div class="fila">
                <div class="etiqueta">1 Dólar (USD)</div>
                <div class="valor" id="usd">--</div>
            </div>

            <!-- ✅ 1 EURO en Pesos Colombianos -->
            <div class="fila">
                <div class="etiqueta">1 Euro (EUR)</div>
                <div class="valor" id="eur">--</div>
            </div>

            <!-- ✅ 1 PESO COLOMBIANO en otras monedas -->
            <div class="fila" style="border-top: 1px dashed #664433; border-bottom: 1px solid #664433; padding: 15px 0;">
                <div class="etiqueta">1 Peso Colombiano (COP)</div>
                <div class="valor" id="cop">--</div>
            </div>

            <!-- ✅ 1 PESO MEXICANO en Pesos Colombianos -->
            <div class="fila">
                <div class="etiqueta">1 Peso Mexicano (MXN)</div>
                <div class="valor" id="mxn">--</div>
            </div>

            <!-- ✅ 1 BOLÍVAR en Pesos Colombianos -->
            <div class="fila">
                <div class="etiqueta">1 Bolívar (VES)</div>
                <div class="valor" id="ves">--</div>
            </div>

            <p class="info">
                📊 API: ExchangeRate-API<br>
                🔗 URL: open.er-api.com/v6/latest/USD<br>
                📋 Datos extraídos en tiempo real
            </p>
        </div>
    </div>

    <script>
        // ==============================================
        // 🔗 API: ExchangeRate-API — Versión gratuita
        // NO necesita clave ni token
        // ==============================================
        const URL = "https://open.er-api.com/v6/latest/USD";

        fetch(URL)
            .then(respuesta => {
                console.log("✅ Conectado a la API");
                return respuesta.json();
            })
            .then(datos => {
                console.log("📋 Todos los datos:", datos);
                console.log("💱 Tasas disponibles:", datos.rates);

                // Extraer valores base
                const tasaUSD = 1; // 1 dólar = referencia
                const tasaCOP = datos.rates.COP; // cuántos COP vale 1 USD
                const tasaEUR = datos.rates.EUR;
                const tasaMXN = datos.rates.MXN;
                const tasaVES = datos.rates.VES;

                // 💰 1 DÓLAR → Pesos Colombianos
                document.getElementById("usd").textContent = tasaCOP.toLocaleString("es-CO") + " COP";

                // 💶 1 EURO → Pesos Colombianos
                const valorEURenCOP = tasaCOP / tasaEUR;
                document.getElementById("eur").textContent = valorEURenCOP.toLocaleString("es-CO", {maximumFractionDigits:0}) + " COP";

                // 🇨🇴 ✅ 1 PESO COLOMBIANO → Dólares
                const valorCOPenUSD = 1 / tasaCOP;
                document.getElementById("cop").textContent = valorCOPenUSD.toFixed(6) + " USD";

                // 🇲🇽 1 PESO MEXICANO → Pesos Colombianos
                const valorMXNenCOP = tasaCOP / tasaMXN;
                document.getElementById("mxn").textContent = valorMXNenCOP.toLocaleString("es-CO", {maximumFractionDigits:0}) + " COP";

                // 🇻🇪 1 BOLÍVAR → Pesos Colombianos
                const valorVESenCOP = tasaCOP / tasaVES;
                document.getElementById("ves").textContent = valorVESenCOP.toLocaleString("es-CO", {maximumFractionDigits:0}) + " COP";
            })
            .catch(error => {
                console.error("❌ Error:", error);
                alert("No se pudo conectar a la API");
            });
    </script>

</body>
</html>
